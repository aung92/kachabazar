<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><title>নোটিফিকেশন সেটিংস</title><link rel="stylesheet" href="/css/font.css"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></head>
<body class="bg-gray-100"><div class="max-w-md mx-auto p-4"><div class="bg-white rounded-lg shadow p-6"><h1 class="font-siyam text-2xl font-bold"><i class="fas fa-bell"></i> নোটিফিকেশন সেটিংস</h1><div class="mt-4 space-y-3"><div class="flex justify-between py-2 border-b"><span>📦 অর্ডার আপডেট</span><label class="switch"><input type="checkbox" id="orderNotif" checked><span class="slider"></span></label></div><div class="flex justify-between py-2 border-b"><span>🎁 অফার ও ডিসকাউন্ট</span><label class="switch"><input type="checkbox" id="offerNotif" checked><span class="slider"></span></label></div><div class="flex justify-between py-2 border-b"><span>🚚 ডেলিভারি আপডেট</span><label class="switch"><input type="checkbox" id="deliveryNotif" checked><span class="slider"></span></label></div><div class="flex justify-between py-2 border-b"><span>💬 রিমাইন্ডার</span><label class="switch"><input type="checkbox" id="reminderNotif" checked><span class="slider"></span></label></div></div><button onclick="saveSettings()" class="w-full mt-4 bg-green-600 text-white py-2 rounded">সেটিংস সংরক্ষণ করুন</button><a href="/pages/dashboard.html" class="block text-center text-green-600 text-sm mt-3">← ড্যাশবোর্ড</a></div></div>
    <style>.switch{position:relative;display:inline-block;width:50px;height:24px;}.switch input{opacity:0;width:0;height:0;}.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:#ccc;transition:.4s;border-radius:24px;}.slider:before{position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;background-color:white;transition:.4s;border-radius:50%;}input:checked+.slider{background-color:#16a34a;}input:checked+.slider:before{transform:translateX(26px);}</style>
    <script>function saveSettings(){alert('নোটিফিকেশন সেটিংস সংরক্ষণ করা হয়েছে');}</script>
</body>
</html>
