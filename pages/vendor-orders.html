<!DOCTYPE html>
<!-- ============================================ -->
<!-- FILE: pages/vendor-orders.html                -->
<!-- PURPOSE: ভেন্ডরের সব অর্ডার দেখানো             -->
<!-- AUTHOR: KachaBazar Team                       -->
<!-- VERSION: 1.0.0                                -->
<!-- LAST UPDATED: 2026-05-05                      -->
<!-- ============================================ -->
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অর্ডার তালিকা - ভেন্ডর</title>
    <link rel="stylesheet" href="/css/font.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-6xl mx-auto p-4">
        
        <!-- Header -->
        <div class="bg-green-600 rounded-lg shadow p-4 mb-4 text-white">
            <div class="flex justify-between items-center">
                <h1 class="font-siyam text-xl font-bold"><i class="fas fa-list"></i> অর্ডার ব্যবস্থাপনা</h1>
                <button onclick="window.location.href='/pages/vendor-dashboard.html'" class="bg-white/20 px-3 py-1 rounded text-sm">
                    <i class="fas fa-arrow-left"></i> ড্যাশবোর্ড
                </button>
            </div>
        </div>
        
        <!-- Order Filters -->
        <div class="bg-white rounded-lg shadow p-3 mb-4">
            <div class="flex flex-wrap gap-2">
                <button class="filter-btn px-3 py-1 rounded-full bg-green-600 text-white text-sm" data-status="all">সব</button>
                <button class="filter-btn px-3 py-1 rounded-full bg-gray-200 text-sm" data-status="pending">⏳ পেন্ডিং</button>
                <button class="filter-btn px-3 py-1 rounded-full bg-gray-200 text-sm" data-status="confirmed">✅ কনফার্ম</button>
                <button class="filter-btn px-3 py-1 rounded-full bg-gray-200 text-sm" data-status="delivered">🚚 ডেলিভারি</button>
            </div>
        </div>
        
        <!-- Orders Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr class="font-hind text-sm">
                            <th class="p-3 text-left">অর্ডার আইডি</th>
                            <th class="p-3 text-left">কাস্টমার</th>
                            <th class="p-3 text-left">পণ্য</th>
                            <th class="p-3 text-left">মোট</th>
                            <th class="p-3 text-left">স্ট্যাটাস</th>
                            <th class="p-3 text-left">অ্যাকশন</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody" class="divide-y">
                        <!-- Orders will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // Check login
        if (localStorage.getItem('vendorLoggedIn') !== 'true') {
            window.location.href = '/pages/vendor-login.html';
        }
        
        // Demo orders data
        const allOrders = [
            { id: 'ORD-001', customer: 'শাহীন আখতার', phone: '017xxxxxxx', product: 'পটল', quantity: 2, amount: 80, status: 'pending', date: '2026-05-05' },
            { id: 'ORD-002', customer: 'মিনহাজ উদ্দিন', phone: '018xxxxxxx', product: 'ইলিশ', quantity: 1, amount: 1200, status: 'confirmed', date: '2026-05-04' },
            { id: 'ORD-003', customer: 'নাজনীন আক্তার', phone: '019xxxxxxx', product: 'আম', quantity: 3, amount: 360, status: 'delivered', date: '2026-05-03' },
            { id: 'ORD-004', customer: 'রাকিব হাসান', phone: '017xxxxxxx', product: 'বেগুন', quantity: 2, amount: 120, status: 'pending', date: '2026-05-05' },
            { id: 'ORD-005', customer: 'ফাতেমা বেগম', phone: '016xxxxxxx', product: 'কাঁঠাল', quantity: 1, amount: 80, status: 'confirmed', date: '2026-05-04' }
        ];
        
        let currentFilter = 'all';
        
        function renderOrders() {
            const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);
            const tbody = document.getElementById('ordersTableBody');
            
            if (filtered.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-8 text-center text-gray-500">কোনো অর্ডার নেই</td></tr>';
                return;
            }
            
            tbody.innerHTML = filtered.map(order => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3 text-sm font-mono">${order.id}</td>
                    <td class="p-3">
                        <p class="font-hind">${order.customer}</p>
                        <p class="text-xs text-gray-400">${order.phone}</p>
                    </td>
                    <td class="p-3">${order.product} x ${order.quantity}</td>
                    <td class="p-3 font-bold text-green-600">৳${order.amount}</td>
                    <td class="p-3">
                        <select onchange="updateStatus('${order.id}', this.value)" class="text-xs px-2 py-1 rounded border ${getStatusBg(order.status)}">
                            <option value="pending" ${order.status === 'pending' ? 'selected' : ''}>⏳ পেন্ডিং</option>
                            <option value="confirmed" ${order.status === 'confirmed' ? 'selected' : ''}>✅ কনফার্ম</option>
                            <option value="delivered" ${order.status === 'delivered' ? 'selected' : ''}>🚚 ডেলিভারি</option>
                        </select>
                    </td>
                    <td class="p-3">
                        <button onclick="viewOrder('${order.id}')" class="text-blue-600 hover:text-blue-800"><i class="fas fa-eye"></i></button>
                    </td>
                </tr>
            `).join('');
        }
        
        function getStatusBg(status) {
            const bg = { pending: 'bg-yellow-50', confirmed: 'bg-blue-50', delivered: 'bg-green-50' };
            return bg[status] || '';
        }
        
        function updateStatus(orderId, newStatus) {
            alert(`অর্ডার ${orderId} স্ট্যাটাস আপডেট: ${newStatus}`);
        }
        
        function viewOrder(orderId) {
            alert(`অর্ডার ${orderId} এর বিস্তারিত দেখা যাচ্ছে`);
        }
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => {
                    b.classList.remove('bg-green-600', 'text-white');
                    b.classList.add('bg-gray-200');
                });
                this.classList.remove('bg-gray-200');
                this.classList.add('bg-green-600', 'text-white');
                currentFilter = this.dataset.status;
                renderOrders();
            });
        });
        
        renderOrders();
    </script>
</body>
</html>
