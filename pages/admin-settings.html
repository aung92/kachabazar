<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><title>সেটিংস - অ্যাডমিন</title><link rel="stylesheet" href="/css/font.css"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></head>
<body class="bg-gray-100">
    <div class="flex"><div class="w-64 bg-green-800 text-white min-h-screen p-4"><div class="text-center"><i class="fas fa-crown text-3xl"></i><h1 class="font-siyam">অ্যাডমিন</h1></div><nav class="mt-8 space-y-2"><a href="/pages/admin-dashboard.html" class="block p-2 rounded hover:bg-green-700"><i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড</a><a href="/pages/admin-settings.html" class="block p-2 rounded bg-green-700"><i class="fas fa-cog"></i> সেটিংস</a><a href="#" onclick="logout()" class="block p-2 rounded hover:bg-red-600"><i class="fas fa-sign-out-alt"></i> লগআউট</a></nav></div>
        <div class="flex-1 p-6"><h1 class="font-siyam text-2xl font-bold">⚙️ সিস্টেম সেটিংস</h1><div class="bg-white rounded shadow p-4 mt-4 space-y-3"><div><label>সাইট নাম</label><input type="text" class="w-full border rounded p-2" value="কাঁচাবাজার"></div><div><label>সাইট লোগো</label><input type="text" class="w-full border rounded p-2" value="/assets/images/logo.svg"></div><div><label>যোগাযোগ ইমেইল</label><input type="email" class="w-full border rounded p-2" value="support@kachabazar.com"></div><div><label>যোগাযোগ নম্বর</label><input type="text" class="w-full border rounded p-2" value="+8801234567890"></div><div><label>ডেলিভারি চার্জ (৳)</label><input type="number" class="w-full border rounded p-2" value="50"></div><div><label>কমিশন পারসেন্টেজ (%)</label><input type="number" class="w-full border rounded p-2" value="10"></div><button onclick="saveSettings()" class="bg-green-600 text-white px-4 py-2 rounded">সেটিংস সংরক্ষণ করুন</button></div></div></div>
    <script>if(localStorage.getItem('adminLoggedIn')!=='true')window.location.href='/pages/admin-login.html';function saveSettings(){alert('সেটিংস সংরক্ষণ করা হয়েছে');}function logout(){localStorage.removeItem('adminLoggedIn');window.location.href='/';}</script>
</body>
</html>
