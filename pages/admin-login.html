<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন লগইন - কাঁচাবাজার</title>
    <link rel="stylesheet" href="/css/font.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full">
            <div class="text-center mb-6">
                <i class="fas fa-crown text-4xl text-yellow-500"></i>
                <h1 class="font-siyam text-2xl font-bold mt-2">অ্যাডমিন প্যানেল</h1>
                <p class="font-hind text-gray-500">সিস্টেম পরিচালনা করুন</p>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block font-hind mb-1">ইউজারনেম</label>
                    <input type="text" id="username" class="w-full border rounded-lg p-3" placeholder="admin">
                </div>
                <div>
                    <label class="block font-hind mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="password" class="w-full border rounded-lg p-3" placeholder="********">
                </div>
                <button onclick="login()" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold">লগইন করুন</button>
                <div class="text-center text-xs text-gray-400">ডেমো: admin / admin123</div>
                <div class="text-center"><a href="/" class="text-gray-500 text-sm"><i class="fas fa-arrow-left"></i> হোম</a></div>
            </div>
        </div>
    </div>
    <script>
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username === 'admin' && password === 'admin123') {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = '/pages/admin-dashboard.html';
            } else { alert('ভুল তথ্য! ডেমো: admin / admin123'); }
        }
        if (localStorage.getItem('adminLoggedIn') === 'true') window.location.href = '/pages/admin-dashboard.html';
    </script>
</body>
</html>
