<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><title>সেটিংস - ভেন্ডর</title><link rel="stylesheet" href="/css/font.css"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></head>
<body class="bg-gray-100">
    <div class="bg-green-600 text-white p-4"><div class="max-w-2xl mx-auto flex justify-between"><h1 class="font-siyam"><i class="fas fa-cog"></i> সেটিংস</h1><button onclick="window.location.href='/pages/vendor-dashboard.html'" class="bg-white/20 px-3 py-1 rounded">ড্যাশবোর্ড</button></div></div>
