<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><title>প্রোফাইল এডিট - কাঁচাবাজার</title><link rel="stylesheet" href="/css/font.css"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></head>
<body class="bg-gray-100">
    <div class="max-w-2xl mx-auto p-4">
        <div class="bg-white rounded-lg shadow p-6">
            <h1 class="font-siyam text-2xl font-bold text-center"><i class="fas fa-edit"></i> প্রোফাইল এডিট</h1>
            <div class="mt-6 space-y-4">
                <div><label class="block font-hind">আপনার নাম</label><input type="text" id="editName" class="w-full border rounded-lg p-2"></div>
                <div><label class="block font-hind">মোবাইল নম্বর</label><input type="tel" id="editPhone" class="w-full border rounded-lg p-2"></div>
                <div><label class="block font-hind">ঠিকানা</label><textarea id="editAddress" rows="2" class="w-full border rounded-lg p-2"></textarea></div>
                <button onclick="saveProfile()" class="w-full bg-green-600 text-white py-2 rounded font-semibold">সংরক্ষণ করুন</button>
                <div class="text-center"><a href="/pages/profile.html" class="text-gray-500 text-sm">← প্রোফাইলে ফিরুন</a></div>
            </div>
        </div>
    </div>
    <script>const user=JSON.parse(localStorage.getItem('kacha_user')||'{"name":"কাস্টমার","phone":"+8801712345678","address":"ঢাকা, বাংলাদেশ"}');document.getElementById('editName').value=user.name;document.getElementById('editPhone').value=user.phone;document.getElementById('editAddress').value=user.address;function saveProfile(){const updated={name:document.getElementById('editName').value,phone:document.getElementById('editPhone').value,address:document.getElementById('editAddress').value,totalOrders:user.totalOrders||12,totalSpent:user.totalSpent||3450,memberSince:user.memberSince||'জানুয়ারি ২০২৬'};localStorage.setItem('kacha_user',JSON.stringify(updated));alert('প্রোফাইল আপডেট করা হয়েছে!');window.location.href='/pages/profile.html';}</script>
</body>
</html>
