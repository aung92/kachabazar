<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>যোগাযোগ - কাঁচাবাজার</title>
    <link rel="stylesheet" href="/css/font.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-2xl mx-auto p-4">
        <div class="bg-white rounded-lg shadow p-6">
            <h1 class="font-siyam text-2xl font-bold text-center">যোগাযোগ করুন</h1>
            
            <div class="mt-6 space-y-4">
                <div class="flex items-center gap-3 p-3 border rounded">
                    <i class="fas fa-phone text-green-600 text-xl"></i>
                    <div>
                        <p class="font-semibold">ফোন</p>
                        <p class="font-hind">+৮৮০ ১২৩৪ ৫৬৭৮৯০</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 p-3 border rounded">
                    <i class="fas fa-envelope text-green-600 text-xl"></i>
                    <div>
                        <p class="font-semibold">ইমেইল</p>
                        <p class="font-hind">support@kachabazar.com</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 p-3 border rounded">
                    <i class="fab fa-facebook text-green-600 text-xl"></i>
                    <div>
                        <p class="font-semibold">Facebook</p>
                        <p class="font-hind">/kachabazar</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 p-3 border rounded">
                    <i class="fab fa-whatsapp text-green-600 text-xl"></i>
                    <div>
                        <p class="font-semibold">WhatsApp</p>
                        <p class="font-hind">+৮৮০ ১২৩৪ ৫৬৭৮৯০</p>
                    </div>
                </div>
            </div>
            
            <div class="mt-6 text-center">
                <button onclick="window.location.href='/'" class="bg-green-600 text-white px-6 py-2 rounded">হোমে ফিরুন</button>
            </div>
        </div>
    </div>
</body>
</html>
