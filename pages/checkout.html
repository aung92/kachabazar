<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>চেকআউট - কাঁচাবাজার</title>
    <link rel="stylesheet" href="/css/font.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-2xl mx-auto p-4">
        <div class="bg-white rounded-lg shadow p-6">
            <h1 class="font-siyam text-2xl font-bold text-center">চেকআউট</h1>
            
            <div class="mt-4">
                <h2 class="font-semibold">অর্ডার সামারি</h2>
                <div id="cartItems" class="border-t mt-2"></div>
                <div class="border-t pt-3 mt-3 text-right">
                    <p class="font-bold">মোট: <span id="totalAmount" class="text-green-600">৳০</span></p>
                </div>
            </div>
            
            <div class="mt-4">
                <label class="block font-hind mb-1">ডেলিভারি ঠিকানা</label>
                <textarea id="address" class="w-full border rounded-lg p-2" rows="2">${localStorage.getItem('userAddress') || ''}</textarea>
            </div>
            
            <div class="mt-4 flex gap-2">
                <button onclick="window.location.href='/pages/products.html'" class="flex-1 bg-gray-500 text-white py-2 rounded">← ফিরুন</button>
                <button onclick="placeOrder()" class="flex-1 bg-green-600 text-white py-2 rounded">অর্ডার কনফার্ম করুন</button>
            </div>
        </div>
    </div>
    
    <script>
        let cart = JSON.parse(localStorage.getItem('kacha_cart') || '[]');
        let total = cart.reduce((sum, item) => sum + item.price, 0);
        
        document.getElementById('cartItems').innerHTML = cart.map(item => `
            <div class="flex justify-between py-2 border-b">
                <span>${item.icon} ${item.name}</span>
                <span>৳${item.price}</span>
            </div>
        `).join('');
        document.getElementById('totalAmount').innerHTML = `৳${total}`;
        
        function placeOrder() {
            const address = document.getElementById('address').value;
            if (!address) {
                alert('দয়া করে ডেলিভারি ঠিকানা দিন');
                return;
            }
            alert('অর্ডার সফল হয়েছে! অর্ডার ট্র্যাকিং পেজে যাচ্ছেন...');
            localStorage.removeItem('kacha_cart');
            window.location.href = '/pages/order-tracking.html';
        }
    </script>
</body>
</html>
