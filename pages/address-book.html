<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><title>ঠিকানা বুক</title><link rel="stylesheet" href="/css/font.css"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></head>
<body class="bg-gray-100"><div class="max-w-2xl mx-auto p-4"><div class="bg-white rounded-lg shadow"><div class="p-4 border-b flex justify-between"><h1 class="font-siyam"><i class="fas fa-map-marker-alt"></i> ঠিকানা বুক</h1><button onclick="addAddress()" class="bg-green-600 text-white px-3 py-1 rounded text-sm">+ নতুন ঠিকানা</button></div><div id="addressList" class="divide-y"></div><div class="p-3 text-center"><a href="/pages/checkout.html" class="text-green-600 text-sm">← চেকআউটে ফিরুন</a></div></div></div>
    <script>let addresses=[{id:1,name:'বাসা',address:'ধানমন্ডি ২৭, ঢাকা',phone:'01712345678',isDefault:true},{id:2,name:'অফিস',address:'গুলশান ১, ঢাকা',phone:'01812345678',isDefault:false}];function render(){document.getElementById('addressList').innerHTML=addresses.map(a=>`<div class="p-3 flex justify-between items-center"><div><p class="font-semibold">${a.name} ${a.isDefault?'<span class="text-xs bg-green-100 px-2 py-0.5 rounded">ডিফল্ট</span>':''}</p><p class="text-sm">${a.address}</p><p class="text-xs text-gray-500">📞 ${a.phone}</p></div><div><button onclick="setDefault(${a.id})" class="text-blue-600 text-sm mr-2">ডিফল্ট</button><button onclick="deleteAddress(${a.id})" class="text-red-600 text-sm">ডিলিট</button></div></div>`).join('');}function addAddress(){const name=prompt('ঠিকানার নাম (বাসা/অফিস):');if(name){const address=prompt('ঠিকানা:');const phone=prompt('মোবাইল নম্বর:');if(address&&phone)addresses.push({id:Date.now(),name,address,phone,isDefault:false});render();}}function setDefault(id){addresses=addresses.map(a=>({...a,isDefault:a.id===id}));render();}function deleteAddress(id){addresses=addresses.filter(a=>a.id!==id);render();}render();</script>
</body>
</html>
