<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><title>নোটিফিকেশন</title><link rel="stylesheet" href="/css/font.css"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></head>
<body class="bg-gray-100"><div class="max-w-2xl mx-auto p-4"><div class="bg-white rounded-lg shadow"><div class="p-4 border-b flex justify-between"><h1 class="font-siyam text-xl"><i class="fas fa-bell"></i> নোটিফিকেশন</h1><button onclick="clearAll()" class="text-red-500 text-sm">সব ক্লিয়ার</button></div><div id="notifList" class="divide-y"></div><div class="p-3 text-center"><a href="/pages/dashboard.html" class="text-green-600 text-sm">← ড্যাশবোর্ড</a></div></div></div>
    <script>let notifications=[{id:1,title:'অর্ডার কনফার্ম',message:'আপনার অর্ডার #ORD-001 কনফার্ম হয়েছে',time:'৫ মিনিট আগে',read:false},{id:2,title:'ডেলিভারি শুরু',message:'আপনার অর্ডার ডেলিভারি শুরু হয়েছে',time:'১ ঘন্টা আগে',read:false},{id:3,title:'অফার!',message:'২০% ছাড় পেতে KACHA20 ব্যবহার করুন',time:'২ দিন আগে',read:true}];function render(){document.getElementById('notifList').innerHTML=notifications.map(n=>`<div class="p-3 flex justify-between ${!n.read?'bg-green-50':''}"><div><p class="font-semibold">${n.title}</p><p class="text-sm text-gray-500">${n.message}</p><p class="text-xs text-gray-400 mt-1">${n.time}</p></div><button onclick="markRead(${n.id})" class="text-green-600 text-sm">${n.read?'পড়া':'পড়ুন'}</button></div>`).join('');}function markRead(id){notifications=notifications.map(n=>n.id===id?{...n,read:true}:n);render();}function clearAll(){notifications=[];render();}render();</script>
</body>
</html>
