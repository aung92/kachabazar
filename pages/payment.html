<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>পেমেন্ট - কাঁচাবাজার</title>
    <link rel="stylesheet" href="/css/font.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-lg shadow p-6">
            <h1 class="font-siyam text-2xl font-bold text-center">💳 পেমেন্ট</h1>
            
            <div class="mt-4">
                <div class="border rounded-lg p-3 mb-2 cursor-pointer hover:bg-gray-50" onclick="selectPayment('bkash')">
                    <div class="flex items-center gap-3">
                        <i class="fab fa-cc-visa text-2xl text-red-500"></i>
                        <span class="font-hind">bKash</span>
                    </div>
                </div>
                <div class="border rounded-lg p-3 mb-2 cursor-pointer hover:bg-gray-50" onclick="selectPayment('nagad')">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-mobile-alt text-2xl text-orange-500"></i>
                        <span class="font-hind">Nagad</span>
                    </div>
                </div>
                <div class="border rounded-lg p-3 cursor-pointer hover:bg-gray-50" onclick="selectPayment('cod')">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-money-bill-wave text-2xl text-green-500"></i>
                        <span class="font-hind">ক্যাশ অন ডেলিভারি</span>
                    </div>
                </div>
            </div>
            
            <button onclick="processPayment()" class="mt-4 w-full bg-green-600 text-white py-3 rounded-lg font-semibold">পেমেন্ট করুন</button>
        </div>
    </div>
    
    <script>
        let selectedMethod = 'cod';
        
        function selectPayment(method) {
            selectedMethod = method;
            alert(`${method} সিলেক্ট করা হয়েছে`);
        }
        
        function processPayment() {
            alert(`পেমেন্ট সফল! ধন্যবাদ।`);
            localStorage.removeItem('kacha_cart');
            window.location.href = '/pages/order-tracking.html';
        }
    </script>
</body>
</html>
