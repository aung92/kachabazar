<!DOCTYPE html>
<!-- ============================================ -->
<!-- FILE: pages/vendor-dashboard.html             -->
<!-- PURPOSE: ভেন্ডর ড্যাশবোর্ড - প্রধান প্যানেল     -->
<!-- AUTHOR: KachaBazar Team                       -->
<!-- VERSION: 1.0.0                                -->
<!-- LAST UPDATED: 2026-05-05                      -->
<!-- ============================================ -->
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভেন্ডর ড্যাশবোর্ড - কাঁচাবাজার</title>
    <!-- Font CSS -->
    <link rel="stylesheet" href="/css/font.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <!-- Main Container -->
    <div class="max-w-6xl mx-auto p-4">
        
        <!-- ============================================ -->
        <!-- HEADER SECTION                               -->
        <!-- ============================================ -->
        <div class="bg-gradient-to-r from-green-600 to-green-700 rounded-lg shadow p-4 mb-4 text-white">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="font-siyam text-2xl font-bold"><i class="fas fa-store"></i> ভেন্ডর প্যানেল</h1>
                    <p class="font-hind text-sm mt-1" id="vendorGreeting"></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.location.href='/'" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded text-sm">
                        <i class="fas fa-home"></i> হোম
                    </button>
                    <button onclick="logout()" class="bg-red-500/80 hover:bg-red-600 px-3 py-1 rounded text-sm">
                        <i class="fas fa-sign-out-alt"></i> লগআউট
                    </button>
                </div>
            </div>
        </div>
        
        <!-- ============================================ -->
        <!-- STATS CARDS - Overview                       -->
        <!-- ============================================ -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
            <!-- Total Orders Card -->
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <i class="fas fa-shopping-cart text-3xl text-blue-500"></i>
                <p class="text-2xl font-bold mt-2" id="totalOrders">0</p>
                <p class="font-hind text-sm text-gray-500">মোট অর্ডার</p>
            </div>
            <!-- Pending Orders Card -->
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <i class="fas fa-clock text-3xl text-yellow-500"></i>
                <p class="text-2xl font-bold mt-2" id="pendingOrders">0</p>
                <p class="font-hind text-sm text-gray-500">পেন্ডিং অর্ডার</p>
            </div>
            <!-- Total Earnings Card -->
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <i class="fas fa-taka-sign text-3xl text-green-500"></i>
                <p class="text-2xl font-bold mt-2" id="totalEarnings">৳০</p>
                <p class="font-hind text-sm text-gray-500">মোট আয়</p>
            </div>
            <!-- Rating Card -->
            <div class="bg-white rounded-lg shadow p-4 text-center">
                <i class="fas fa-star text-3xl text-yellow-400"></i>
                <p class="text-2xl font-bold mt-2">4.8</p>
                <p class="font-hind text-sm text-gray-500">রেটিং</p>
            </div>
        </div>
        
        <!-- ============================================ -->
        <!-- QUICK ACTION BUTTONS                         -->
        <!-- ============================================ -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4">
            <button onclick="window.location.href='/pages/vendor-orders.html'" class="bg-white rounded-lg shadow p-3 text-center hover:shadow-md transition">
                <i class="fas fa-list-ul text-2xl text-green-600"></i>
                <p class="font-hind text-sm mt-1">অর্ডার দেখুন</p>
            </button>
            <button onclick="window.location.href='/pages/vendor-wallet.html'" class="bg-white rounded-lg shadow p-3 text-center hover:shadow-md transition">
                <i class="fas fa-wallet text-2xl text-green-600"></i>
                <p class="font-hind text-sm mt-1">ওয়ালেট</p>
            </button>
            <button onclick="window.location.href='/pages/products.html'" class="bg-white rounded-lg shadow p-3 text-center hover:shadow-md transition">
                <i class="fas fa-plus-circle text-2xl text-green-600"></i>
                <p class="font-hind text-sm mt-1">পণ্য যোগ করুন</p>
            </button>
            <button onclick="showNotification()" class="bg-white rounded-lg shadow p-3 text-center hover:shadow-md transition">
                <i class="fas fa-bell text-2xl text-green-600"></i>
                <p class="font-hind text-sm mt-1">নোটিফিকেশন</p>
            </button>
        </div>
        
        <!-- ============================================ -->
        <!-- RECENT ORDERS LIST                           -->
        <!-- ============================================ -->
        <div class="bg-white rounded-lg shadow">
            <div class="p-4 border-b">
                <h2 class="font-siyam font-bold text-lg"><i class="fas fa-clock"></i> সাম্প্রতিক অর্ডার</h2>
            </div>
            <div id="recentOrdersList" class="divide-y">
                <!-- Orders will be loaded dynamically -->
                <div class="p-4 text-center text-gray-500 font-hind">
                    <i class="fas fa-box-open text-2xl mb-2 block"></i>
                    <p>কোনো অর্ডার নেই</p>
                </div>
            </div>
            <div class="p-4 border-t text-center">
                <button onclick="window.location.href='/pages/vendor-orders.html'" class="text-green-600 font-hind">সব অর্ডার দেখুন →</button>
            </div>
        </div>
    </div>
    
    <script>
        /* ============================================ */
        /* VENDOR DASHBOARD SCRIPT                      */
        /* ============================================ */
        
        // Check vendor login status
        if (localStorage.getItem('vendorLoggedIn') !== 'true') {
            window.location.href = '/pages/vendor-login.html';
        }
        
        // Set vendor greeting
        const vendorName = localStorage.getItem('vendorName') || 'ভেন্ডর';
        document.getElementById('vendorGreeting').innerHTML = `স্বাগতম, ${vendorName}! 👋`;
        
        // Demo data for stats
        document.getElementById('totalOrders').innerText = '24';
        document.getElementById('pendingOrders').innerText = '5';
        document.getElementById('totalEarnings').innerText = '৳১২,৪৫০';
        
        // Demo recent orders
        const demoOrders = [
            { id: 'ORD-001', customer: 'শাহীন আখতার', product: 'পটল', amount: 120, status: 'pending' },
            { id: 'ORD-002', customer: 'মিনহাজ উদ্দিন', product: 'ইলিশ', amount: 2400, status: 'confirmed' },
            { id: 'ORD-003', customer: 'নাজনীন আক্তার', product: 'আম', amount: 360, status: 'delivered' }
        ];
        
        // Render recent orders
        function loadRecentOrders() {
            const container = document.getElementById('recentOrdersList');
            container.innerHTML = demoOrders.map(order => `
                <div class="p-3 flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <p class="font-semibold font-hind">${order.product}</p>
                        <p class="text-xs text-gray-500">${order.customer} | ${order.id}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-green-600">৳${order.amount}</p>
                        <span class="text-xs px-2 py-1 rounded-full ${getStatusClass(order.status)}">${getStatusText(order.status)}</span>
                    </div>
                </div>
            `).join('');
        }
        
        function getStatusClass(status) {
            const classes = { pending: 'bg-yellow-100 text-yellow-800', confirmed: 'bg-blue-100 text-blue-800', delivered: 'bg-green-100 text-green-800' };
            return classes[status] || 'bg-gray-100';
        }
        
        function getStatusText(status) {
            const texts = { pending: 'পেন্ডিং', confirmed: 'কনফার্ম', delivered: 'ডেলিভারি' };
            return texts[status] || status;
        }
        
        function showNotification() {
            alert('📢 নতুন অর্ডার নেই');
        }
        
        function logout() {
            localStorage.removeItem('vendorLoggedIn');
            localStorage.removeItem('vendorEmail');
            localStorage.removeItem('vendorName');
            window.location.href = '/';
        }
        
        loadRecentOrders();
    </script>
</body>
</html>
