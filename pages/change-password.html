<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><title>পাসওয়ার্ড পরিবর্তন</title><link rel="stylesheet" href="/css/font.css"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></head>
<body class="bg-gray-100">
    <div class="max-w-md mx-auto p-4">
        <div class="bg-white rounded-lg shadow p-6"><h1 class="font-siyam text-2xl font-bold text-center"><i class="fas fa-key"></i> পাসওয়ার্ড পরিবর্তন</h1>
        <div class="mt-6 space-y-4"><div><label>বর্তমান পাসওয়ার্ড</label><input type="password" id="oldPass" class="w-full border rounded p-2"></div>
        <div><label>নতুন পাসওয়ার্ড</label><input type="password" id="newPass" class="w-full border rounded p-2"></div>
        <div><label>নতুন পাসওয়ার্ড নিশ্চিত করুন</label><input type="password" id="confirmPass" class="w-full border rounded p-2"></div>
        <button onclick="changePassword()" class="w-full bg-blue-600 text-white py-2 rounded">পাসওয়ার্ড পরিবর্তন করুন</button>
        <div class="text-center"><a href="/pages/profile.html" class="text-green-600 text-sm">← প্রোফাইলে ফিরুন</a></div></div></div></div>
    <script>function changePassword(){const oldPass=document.getElementById('oldPass').value,newPass=document.getElementById('newPass').value,confirmPass=document.getElementById('confirmPass').value;if(!oldPass||!newPass){alert('সব তথ্য পূরণ করুন');return;}if(newPass!==confirmPass){alert('নতুন পাসওয়ার্ড মিলছে না');return;}alert('পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে!');window.location.href='/pages/profile.html';}</script>
</body>
</html>
