<!DOCTYPE html>
<html lang="bn">
<head><meta charset="UTF-8"><title>কাস্টমার লিস্ট - অ্যাডমিন</title><link rel="stylesheet" href="/css/font.css"><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"></head>
<body class="bg-gray-100">
    <div class="flex"><div class="w-64 bg-green-800 text-white min-h-screen p-4"><div class="text-center"><i class="fas fa-crown text-3xl"></i><h1 class="font-siyam">অ্যাডমিন</h1></div><nav class="mt-8 space-y-2"><a href="/pages/admin-dashboard.html" class="block p-2 rounded hover:bg-green-700"><i class="fas fa-tachometer-alt"></i> ড্যাশবোর্ড</a><a href="/pages/admin-customers.html" class="block p-2 rounded bg-green-700"><i class="fas fa-users"></i> কাস্টমার</a><a href="#" onclick="logout()" class="block p-2 rounded hover:bg-red-600"><i class="fas fa-sign-out-alt"></i> লগআউট</a></nav></div>
        <div class="flex-1 p-6"><h1 class="font-siyam text-2xl font-bold">👥 কাস্টমার লিস্ট</h1><div class="bg-white rounded shadow mt-4 overflow-x-auto"><table class="w-full"><thead class="bg-gray-50"><tr><th class="p-3">নাম</th><th>মোবাইল</th><th>ঠিকানা</th><th>অর্ডার</th><th>জয়েন তারিখ</th><th>স্ট্যাটাস</th></tr></thead><tbody id="customerList"></tbody></table></div></div></div>
    <script>if(localStorage.getItem('adminLoggedIn')!=='true')window.location.href='/pages/admin-login.html';const customers=[{name:'শাহীন আখতার',phone:'017xxxxxxx',address:'ধানমন্ডি',orders:12,date:'২০২৬-০১-১৫',status:'active'},{name:'মিনহাজ উদ্দিন',phone:'018xxxxxxx',address:'গুলশান',orders:8,date:'২০২৬-০২-২০',status:'active'},{name:'নাজনীন আক্তার',phone:'019xxxxxxx',address:'উত্তরা',orders:5,date:'২০২৬-০৩-১০',status:'active'}];document.getElementById('customerList').innerHTML=customers.map(c=>`<tr class="border-b"><td class="p-3">${c.name}</td><td>${c.phone}</td><td>${c.address}</td><td>${c.orders}</td><td>${c.date}</td><td><span class="px-2 py-1 rounded text-xs bg-green-100 text-green-800">সক্রিয়</span></td></tr>`).join('');function logout(){localStorage.removeItem('adminLoggedIn');window.location.href='/';}</script>
</body>
</html>
