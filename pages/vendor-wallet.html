<!DOCTYPE html>
<!-- ============================================ -->
<!-- FILE: pages/vendor-wallet.html                -->
<!-- PURPOSE: ভেন্ডর ওয়ালেট ও কমিশন দেখানো        -->
<!-- AUTHOR: KachaBazar Team                       -->
<!-- VERSION: 1.0.0                                -->
<!-- LAST UPDATED: 2026-05-05                      -->
<!-- ============================================ -->
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়ালেট - ভেন্ডর</title>
    <link rel="stylesheet" href="/css/font.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="max-w-md mx-auto p-4">
        
        <!-- Wallet Balance Card -->
        <div class="bg-gradient-to-r from-green-500 to-green-600 rounded-2xl shadow-lg p-6 mb-4 text-white">
            <p class="font-hind text-sm opacity-90"><i class="fas fa-wallet"></i> মোট ব্যালেন্স</p>
            <p class="font-siyam text-4xl font-bold mt-2">৳১২,৪৫০</p>
            <div class="flex justify-between mt-4 text-sm">
                <span>পেন্ডিং: ৳২,৩০০</span>
                <span>উত্তোলনযোগ্য: ৳১০,১৫০</span>
            </div>
        </div>
        
        <!-- Transaction History -->
        <div class="bg-white rounded-lg shadow mb-4">
            <div class="p-3 border-b">
                <h2 class="font-semibold"><i class="fas fa-history"></i> লেনদেনের ইতিহাস</h2>
            </div>
            <div class="divide-y">
                <div class="p-3 flex justify-between">
                    <div>
                        <p class="font-semibold font-hind">অর্ডার #ORD-001</p>
                        <p class="text-xs text-gray-400">০৫ মে, ২০২৬</p>
                    </div>
                    <div class="text-right">
                        <p class="text-green-600 font-bold">+৳১,২০০</p>
                        <p class="text-xs text-gray-400">কমিশন: ৳১২০</p>
                    </div>
                </div>
                <div class="p-3 flex justify-between">
                    <div>
                        <p class="font-semibold font-hind">অর্ডার #ORD-002</p>
                        <p class="text-xs text-gray-400">০৪ মে, ২০২৬</p>
                    </div>
                    <div class="text-right">
                        <p class="text-green-600 font-bold">+৳৮০০</p>
                        <p class="text-xs text-gray-400">কমিশন: ৳৮০</p>
                    </div>
                </div>
                <div class="p-3 flex justify-between">
                    <div>
                        <p class="font-semibold font-hind">উত্তোলন</p>
                        <p class="text-xs text-gray-400">০৩ মে, ২০২৬</p>
                    </div>
                    <div class="text-right">
                        <p class="text-red-600 font-bold">-৳৫,০০০</p>
                        <p class="text-xs text-gray-400">bKash</p>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Withdraw Button -->
        <button onclick="requestWithdraw()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold mb-3">
            <i class="fas fa-hand-holding-usd"></i> টাকা উত্তোলন করুন
        </button>
        
        <!-- Back Button -->
        <button onclick="window.location.href='/pages/vendor-dashboard.html'" class="w-full bg-gray-500 text-white py-2 rounded-lg">
            <i class="fas fa-arrow-left"></i> ড্যাশবোর্ডে ফিরুন
        </button>
    </div>
    
    <script>
        if (localStorage.getItem('vendorLoggedIn') !== 'true') {
            window.location.href = '/pages/vendor-login.html';
        }
        
        function requestWithdraw() {
            const amount = prompt('কত টাকা উত্তোলন করতে চান?', '1000');
            if (amount && amount > 0) {
                alert(`${amount} টাকা উত্তোলনের অনুরোধ গৃহীত হয়েছে। ২৪ ঘন্টার মধ্যে টাকা পাঠিয়ে দেওয়া হবে।`);
            }
        }
    </script>
</body>
</html>
