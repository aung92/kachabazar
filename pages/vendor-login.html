<!DOCTYPE html>
<!-- ============================================ -->
<!-- FILE: pages/vendor-login.html                 -->
<!-- PURPOSE: ভেন্ডর লগইন পেজ                      -->
<!-- AUTHOR: KachaBazar Team                       -->
<!-- VERSION: 1.0.0                                -->
<!-- LAST UPDATED: 2026-05-05                      -->
<!-- ============================================ -->
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ভেন্ডর লগইন - কাঁচাবাজার</title>
    <!-- Font CSS -->
    <link rel="stylesheet" href="/css/font.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Login page gradient background */
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1f2937, #111827); }
        /* Login card styling */
        .login-card { background: white; border-radius: 24px; padding: 2rem; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        /* Input field styling */
        .input-group { margin-bottom: 1.2rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-family: 'Hind Siliguri', sans-serif; color: #4b5563; }
        .input-group input { width: 100%; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 12px; font-family: 'Hind Siliguri', sans-serif; transition: all 0.2s; }
        .input-group input:focus { outline: none; border-color: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,0.1); }
        /* Login button styling */
        .btn-login { width: 100%; background: #16a34a; color: white; padding: 12px; border: none; border-radius: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: 'Hind Siliguri', sans-serif; }
        .btn-login:hover { background: #15803d; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Logo and title section -->
            <div class="text-center mb-6">
                <i class="fas fa-store text-4xl text-green-600"></i>
                <h1 class="font-siyam text-2xl font-bold mt-2">ভেন্ডর প্যানেল</h1>
                <p class="font-hind text-gray-500 text-sm">আপনার স্টোর পরিচালনা করুন</p>
            </div>
            
            <!-- Login form -->
            <div class="input-group">
                <label class="font-hind"><i class="fas fa-envelope mr-2"></i> ইমেইল</label>
                <input type="email" id="email" placeholder="vendor@kachabazar.com" class="font-hind">
            </div>
            <div class="input-group">
                <label class="font-hind"><i class="fas fa-lock mr-2"></i> পাসওয়ার্ড</label>
                <input type="password" id="password" placeholder="********" class="font-hind">
            </div>
            
            <button class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> লগইন করুন
            </button>
            
            <!-- Demo credentials info -->
            <div class="mt-4 text-center text-xs text-gray-400 font-hind">
                <p>ডেমো অ্যাকাউন্ট: vendor@kachabazar.com / 123456</p>
            </div>
            
            <!-- Back to home link -->
            <div class="text-center mt-4">
                <a href="/" class="text-gray-400 text-sm"><i class="fas fa-arrow-left"></i> হোমে ফিরুন</a>
            </div>
        </div>
    </div>
    
    <script>
        /* ============================================ */
        /* VENDOR LOGIN SCRIPT                         */
        /* ============================================ */
        
        // Get DOM elements
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        
        // Login button click handler
        loginBtn.addEventListener('click', function() {
            const email = emailInput.value;
            const password = passwordInput.value;
            
            // Simple validation
            if (!email || !password) {
                alert('ইমেইল এবং পাসওয়ার্ড দিন');
                return;
            }
            
            // Demo login - Check credentials
            if (email === 'vendor@kachabazar.com' && password === '123456') {
                // Save vendor session
                localStorage.setItem('vendorLoggedIn', 'true');
                localStorage.setItem('vendorEmail', email);
                localStorage.setItem('vendorName', 'জনাব ভেন্ডর');
                // Redirect to vendor dashboard
                window.location.href = '/pages/vendor-dashboard.html';
            } else {
                alert('ভুল ইমেইল বা পাসওয়ার্ড! ডেমো: vendor@kachabazar.com / 123456');
            }
        });
        
        // Check if already logged in
        if (localStorage.getItem('vendorLoggedIn') === 'true') {
            window.location.href = '/pages/vendor-dashboard.html';
        }
    </script>
</body>
</html>
