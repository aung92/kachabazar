# ============================================
# DOCKER COMPOSE FOR LOCAL DEVELOPMENT
# Run: docker-compose up -d
# ============================================

version: '3.8'

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: kachabazar-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped

  # Redis Cache (Optional)
  redis:
    image: redis:alpine
    container_name: kachabazar-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # PostgreSQL (Local development - optional, use Supabase for production)
  postgres:
    image: postgres:15-alpine
    container_name: kachabazar-postgres
    environment:
      POSTGRES_DB: kachabazar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: